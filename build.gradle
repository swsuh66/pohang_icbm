plugins {
    id 'org.springframework.boot' version '2.7.0'
    id 'io.spring.dependency-management' version '1.0.11.RELEASE'
    id 'java'
    id 'war'
}

group = 'com.istec'
version = 'Ver_Phis_260601'

sourceCompatibility = '1.8'
targetCompatibility = '1.8'

war {
    enabled = true
    archiveClassifier = 'plain'
    manifest {
        attributes(
            'Implementation-Version': version
        )
    }
}

bootWar {
    enabled = false
}

repositories {
    mavenCentral()
}

configurations {
    all {
        // ??? ?? ?? ??(Logback ??)? ??? ??
        exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:2.2.0'
    implementation 'org.springframework.boot:spring-boot-starter-security:2.6.4'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    implementation 'org.springframework.security:spring-security-core:3.1.7.RELEASE'
    implementation "org.springframework.security:spring-security-config:3.2.3.RELEASE"
    implementation "org.springframework.security:spring-security-web:3.2.3.RELEASE"
    implementation 'org.postgresql:postgresql:42.2.23'
    implementation 'p6spy:p6spy:3.9.1'
    implementation 'com.googlecode.json-simple:json-simple:1.1.1'
    implementation 'javax.servlet:javax.servlet-api:4.0.0'
    implementation 'javax.servlet.jsp:javax.servlet.jsp-api:2.3.3'
    implementation 'org.apache.commons:commons-io:1.3.2'
    implementation 'org.apache.commons:commons-lang3:3.12.0'
    implementation 'commons-io:commons-io:2.11.0'
    implementation 'org.apache.poi:poi:3.17'
    implementation 'org.apache.poi:poi-ooxml:3.17'
    implementation 'org.apache.tomcat:tomcat-jdbc:9.0.56'
    implementation 'org.apache.tomcat.embed:tomcat-embed-jasper:9.0.63'
    implementation 'javax.servlet:jstl:1.2'
    implementation ('org.springframework.boot:spring-boot-starter-web') {
        // ?? ?? ?????? Logback ??
        exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
    }
    // Log4j2 ??? ??
    implementation 'org.springframework.boot:spring-boot-starter-log4j2'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    providedRuntime 'org.springframework.boot:spring-boot-starter-tomcat'
}


test {
    useJUnitPlatform()
}



















